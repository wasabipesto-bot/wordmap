[project]
name = "wordmap-pipeline"
version = "0.1.0"
description = "Data pipeline for wordmap: English words laid out by edit distance"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "orjson>=3.10",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "umap-learn>=0.5.7",
    "wordfreq>=3.1",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
